<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LifeTrack Mini — трекер привычек</title>
<meta name="description" content="Личный трекер привычек: отмечай дни и следи за прогрессом." />
<style>
  :root{--ink:#0a0a0b;--raised:#141417;--line:#26262b;--porcelain:#ece8e1;--dim:#a7a39c;--muted:#6b6b70;--iris:#6e56f7;--iris-b:#8b78ff;--ember:#f76e56;--green:#4ade80;
    --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:28px 18px 44px;font-family:var(--font);color:var(--porcelain);
    background:radial-gradient(circle at 50% -10%,rgba(110,86,247,.14),transparent 55%),var(--ink);-webkit-font-smoothing:antialiased}
  h1{font-size:clamp(1.05rem,4.5vw,1.35rem);font-weight:650;text-align:center;line-height:1.35;max-width:100%}
  .card{width:min(760px,100%);background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
  .add{display:flex;gap:10px}
  .add input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:10px;color:var(--porcelain);padding:11px 13px;font:400 .9rem var(--font)}
  .add input:focus{outline:none;border-color:var(--iris)}
  .add button{font:500 .85rem var(--font);padding:11px 18px;border-radius:999px;border:1px solid var(--porcelain);background:var(--porcelain);color:var(--ink);cursor:pointer;transition:.25s}
  .add button:hover{background:transparent;color:var(--porcelain)}
  .habit{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--ink)}
  .habit__head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .habit__name{font-weight:600;font-size:.95rem;margin-right:auto;overflow-wrap:anywhere}
  .streak{font:600 .7rem var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .streak b{color:var(--iris-b)}
  .today{font:600 .78rem var(--font);padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;transition:.2s}
  .today:hover{border-color:var(--iris);color:var(--iris-b)}
  .today.done{border-color:rgba(74,222,128,.5);color:var(--green);background:rgba(74,222,128,.06)}
  .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:4px 6px;border-radius:6px}
  .del:hover{color:var(--ember)}
  .heatmap-scroll{width:100%;max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding:3px 1px 8px}
  .heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,10px);grid-template-columns:repeat(26,10px);gap:3px;width:max-content}
  .cell{width:10px;height:10px;border-radius:2.5px;background:var(--line)}
  .cell[data-v="1"]{background:rgba(110,86,247,.45)}
  .cell[data-v="2"]{background:var(--iris)}
  .cell[data-v="3"]{background:var(--iris-b)}
  .cell.today-cell{outline:1px solid var(--porcelain)}
  .legend{display:flex;align-items:center;gap:5px;font:500 .64rem var(--mono);color:var(--muted);justify-content:flex-end}
  .legend .cell{display:inline-block}
  .empty{color:var(--muted);font-style:italic;font-size:.85rem;text-align:center;padding:14px}
  .foot{font-size:.75rem;color:var(--muted)}
  .foot a{color:var(--dim);text-decoration:none}
  #habits{display:flex;flex-direction:column;gap:14px;min-width:0}
  .hint{font-size:.72rem;color:var(--muted);line-height:1.4}
  @media(max-width:480px){
    body{padding:24px 14px calc(35px + env(safe-area-inset-bottom));gap:20px;width:100%;overflow-x:hidden}
    .card{width:100%;min-width:0;padding:14px;border-radius:16px}
    .habit{padding:13px;min-width:0}
    .habit__head{gap:9px}
    .habit__name{flex-basis:100%;font-size:1rem}
    .streak{margin-right:auto;line-height:1.6}
    .add{gap:8px}
    .add input{font-size:16px;padding:11px 10px}
    .add button{padding:11px 13px}
    .today{min-height:38px}
  }
</style>
</head>
<body>
  <h1>LifeTrack Mini — Каждый день лучше</h1>
  <div class="card">
    <div class="add">
      <input id="name" maxlength="40" placeholder="Например, читать 20 минут" aria-label="Название привычки" />
      <button id="add" type="button">Добавить</button>
    </div>
    <p class="hint">Календарь можно листать пальцем влево и вправо.</p>
    <div id="habits"></div>
  </div>
  <footer class="foot"><a href="https://github.com/Ansagan359/habit-tracker" target="_blank" rel="noopener">Исходный код на GitHub</a></footer>

<script>
(() => {
  'use strict';
  const KEY = 'streaks.v1';
  const $ = (id) => document.getElementById(id);
  const DAYS = 26 * 7; // ~ half a year of cells, GitHub-style columns by week

  let state = load();

  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (_) {}
    // Новым пользователям показываем пустой трекер без вымышленных отметок.
    return { habits: [] };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {} }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function isoDaysAgo(n) {
    const d = new Date();
    d.setDate(d.getDate() - n);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  const today = () => isoDaysAgo(0);

  function streaks(marks) {
    let current = 0;
    // Current streak: today may still be unmarked, so start counting from
    // today if marked, otherwise from yesterday.
    let offset = marks[today()] ? 0 : 1;
    while (marks[isoDaysAgo(offset + current)]) current++;
    // Сегодня уже включён в цикл выше, второй раз его не считаем.

    let best = 0, run = 0;
    for (let i = 365; i >= 0; i--) {
      run = marks[isoDaysAgo(i)] ? run + 1 : 0;
      if (run > best) best = run;
    }
    return { current, best };
  }

  function render() {
    const box = $('habits');
    box.innerHTML = '';
    if (!state.habits.length) {
      box.innerHTML = '<div class="empty">Привычек пока нет. Добавь первую выше!</div>';
      return;
    }
    for (const habit of state.habits) box.append(renderHabit(habit));
  }

  function renderHabit(habit) {
    const wrap = el('section', 'habit');
    const head = el('div', 'habit__head');
    head.append(el('span', 'habit__name', habit.name));

    const s = streaks(habit.marks);
    const streak = el('span', 'streak');
    streak.innerHTML = 'СЕРИЯ <b>' + s.current + ' дн.</b> · РЕКОРД <b>' + s.best + ' дн.</b>';
    head.append(streak);

    const btn = el('button', 'today' + (habit.marks[today()] ? ' done' : ''),
      habit.marks[today()] ? '✓ Сегодня выполнено' : 'Отметить сегодня');
    btn.type = 'button';
    btn.addEventListener('click', () => {
      if (habit.marks[today()]) delete habit.marks[today()];
      else habit.marks[today()] = true;
      save(); render();
    });
    head.append(btn);

    const del = el('button', 'del', '✕');
    del.type = 'button';
    del.title = 'Удалить привычку';
    del.setAttribute('aria-label', 'Удалить привычку ' + habit.name);
    del.addEventListener('click', () => {
      if (!confirm('Удалить привычку «' + habit.name + '»?')) return;
      state.habits = state.habits.filter((h) => h.id !== habit.id);
      save(); render();
    });
    head.append(del);
    wrap.append(head);

    // Heatmap: oldest on the left, aligned to weeks (columns of 7).
    const map = el('div', 'heatmap');
    const startOffset = DAYS - 1;
    for (let i = startOffset; i >= 0; i--) {
      const iso = isoDaysAgo(i);
      const cell = el('span', 'cell' + (i === 0 ? ' today-cell' : ''));
      if (habit.marks[iso]) {
        // Intensity grows with neighbours marked — purely visual sugar.
        const nb = (habit.marks[isoDaysAgo(i + 1)] ? 1 : 0) + (habit.marks[isoDaysAgo(i - 1)] ? 1 : 0);
        cell.dataset.v = String(1 + nb);
      }
      cell.title = iso + (habit.marks[iso] ? ' — выполнено' : ' — не выполнено');
      map.append(cell);
    }
    const scroller = el('div', 'heatmap-scroll');
    scroller.setAttribute('aria-label', 'Календарь выполнения привычки');
    scroller.append(map);
    wrap.append(scroller);
    requestAnimationFrame(() => { scroller.scrollLeft = scroller.scrollWidth; });

    const legend = el('div', 'legend');
    legend.append('меньше');
    for (const v of ['', '1', '2', '3']) {
      const c = el('span', 'cell');
      if (v) c.dataset.v = v;
      legend.append(c);
    }
    legend.append('больше');
    wrap.append(legend);

    return wrap;
  }

  $('add').addEventListener('click', addHabit);
  $('name').addEventListener('keydown', (e) => { if (e.key === 'Enter') addHabit(); });

  function addHabit() {
    const name = $('name').value.trim();
    if (name.length < 2) { $('name').focus(); return; }
    state.habits.unshift({ id: uid(), name, marks: {} });
    $('name').value = '';
    save(); render();
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  render();
})();
</script>
</body>
</html>
