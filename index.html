<style>
:root{color-scheme:light;--bg:#f8f5f2;--card:#fff;--ink:#26212a;--muted:#807c83;--line:#ece7e7;--accent:#8067d5;--soft:#f0eaff;--green:#287b52;--good:#e5f4e9;--danger:#c44444;--shadow:0 10px 30px #28221a08}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:680px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 18px calc(105px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.brand{font-weight:800;letter-spacing:-.5px;font-size:20px}.pill{background:var(--soft);color:var(--accent);border-radius:40px;padding:8px 12px;font-size:12px;font-weight:700}
h1{font-size:34px;letter-spacing:-1px;line-height:1.15;margin:0 0 8px}h2{font-size:21px;margin:26px 0 14px;letter-spacing:-.4px}p{margin:0}.sub{color:var(--muted);font-size:14px;line-height:1.5}.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-top:14px;min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grow{flex:1;min-width:0}.name{font-weight:750;font-size:18px;overflow-wrap:anywhere}.eyebrow{font-size:12px;color:var(--accent);font-weight:750;letter-spacing:.4px}.small{font-size:12px;color:var(--muted)}.progress{height:9px;border-radius:30px;background:var(--line);overflow:hidden;margin:15px 0 8px}.progress>span{display:block;background:var(--accent);height:100%;border-radius:30px}.btn{border:0;border-radius:16px;padding:13px 16px;background:var(--accent);color:#fff;font-weight:750}.btn.secondary{background:var(--soft);color:var(--accent)}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn.full{width:100%}.btn:disabled{opacity:.45}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.actions .btn{flex:1}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:18px 0}.day{text-align:center;font-size:11px;color:var(--muted);min-width:0}.day b{display:flex;align-items:center;justify-content:center;margin:7px auto 0;width:min(36px,100%);aspect-ratio:1;border-radius:50%;background:var(--bg);font-size:12px;color:var(--ink)}.day b.done{background:var(--good);color:var(--green)}.day b.current{outline:2px solid var(--accent);outline-offset:1px}
.grid-days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:16px}.tile{aspect-ratio:1;border-radius:13px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-weight:750;min-width:0}.tile.done{background:var(--good);color:var(--green);border-color:var(--green)}.tile.current{border:2px solid var(--accent);color:var(--ink)}.tile.future{opacity:.55}.tile:disabled{cursor:default}
.nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),640px);display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 12px 40px #0002;z-index:10}.nav button{background:transparent;border:0;border-radius:18px;padding:11px 3px;color:var(--muted);font-size:12px;font-weight:650}.nav button.active{background:var(--soft);color:var(--accent)}.nav button span{display:block;font-size:21px;margin-bottom:3px}
.field{display:block;font-weight:700;font-size:13px;margin:17px 0 7px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);padding:13px;font-size:16px}textarea{resize:vertical;min-height:78px}.form-actions{display:flex;gap:10px;margin-top:24px}.form-actions button{flex:1}.back{border:0;background:none;color:var(--accent);padding:4px 0 20px;font-weight:700}.empty{text-align:center;padding:32px 12px;color:var(--muted)}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.statgrid .panel{margin:0}.big{font-size:32px;font-weight:800}.hidden{display:none!important}.note{padding:12px;background:var(--soft);color:var(--accent);border-radius:14px;font-size:12px;line-height:1.5;margin-top:14px}.danger{color:var(--danger)!important}
.hero-photo{position:relative;min-height:245px;border-radius:27px;overflow:hidden;background:#e8dff2;margin:17px 0 22px;display:flex;align-items:flex-end;color:#fff}.hero-photo img,.catalog-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero-photo:after,.catalog-card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 18%,rgba(18,13,24,.79))}.hero-content{position:relative;z-index:1;padding:24px;width:100%}.hero-content h1{font-size:34px;color:white}.hero-content .sub{color:#f1eefa}.catalog-heading{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}.catalog-heading h2{margin:0}.catalog-scroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 1px 10px;margin-right:-18px;scrollbar-width:none}.catalog-card{position:relative;flex:0 0 68%;height:218px;border:0;border-radius:23px;overflow:hidden;scroll-snap-align:start;text-align:left;background:#e6dfee;color:white}.catalog-card .hero-content{padding:17px}.catalog-card strong{font-size:21px;display:block}.catalog-card small{display:block;opacity:.9;margin-top:5px}.catalog-card .eyebrow{color:#eee3ff}.detail-section{padding:19px;background:var(--card);border:1px solid var(--line);border-radius:22px;margin-top:13px}.detail-section h2{margin:0 0 12px}.detail-section p{line-height:1.65;color:#57525a}.detail-section .steps{white-space:pre-line}.info-tags{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.info-tags span{background:var(--soft);color:#6953b1;border-radius:100px;padding:9px 12px;font-size:12px;font-weight:750}.btn{box-shadow:0 4px 10px #8067d512}.panel{border-color:#f0ebeb}.nav{box-shadow:0 10px 35px #40303c18}.catalog-intro{margin-top:8px}.highlight-note{background:#fff5dc;color:#806126;padding:14px;border-radius:16px;font-size:13px;line-height:1.5}@media(max-width:390px){.catalog-card{flex-basis:77%}.hero-photo{min-height:220px}}
.nav{width:min(calc(100% - 112px),390px);border-radius:100px;padding:5px;bottom:calc(19px + env(safe-area-inset-bottom));box-shadow:0 12px 35px #332e3425}.nav button{border-radius:100px;padding:9px 2px;font-size:10px}.nav button span{font-size:23px;margin:0 0 2px}.catalog-top{padding-top:4px}.catalog-top h1{font-size:28px}.floating-create{position:fixed;z-index:12;bottom:calc(101px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:0;border-radius:50px;background:#242126;color:white;font-weight:750;padding:13px 22px;box-shadow:0 8px 28px #0003;white-space:nowrap;font-size:14px}.catalog-scroll{gap:11px}.catalog-card{flex-basis:43%;height:185px;border-radius:20px}.catalog-card strong{font-size:17px;line-height:1.18}.catalog-card small{font-size:11px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.catalog-card .hero-content{padding:13px}.catalog-heading{margin-top:19px}.catalog-heading h2{font-size:21px}.hero-photo{min-height:265px;margin-top:12px}.app{padding-bottom:calc(160px + env(safe-area-inset-bottom))}@media(max-width:390px){.catalog-card{flex-basis:48%}}
.top{padding-bottom:6px!important;margin-bottom:4px!important}.brand{font-size:19px!important}.nav{width:min(calc(100% - 150px),300px)!important;bottom:calc(16px + env(safe-area-inset-bottom))!important;padding:5px!important}.nav button{font-size:0!important;min-height:49px!important;padding:8px!important}.nav button span{font-size:26px!important;margin:0!important}.today-summary{display:flex;align-items:center;justify-content:space-between;margin:12px 0 14px}.today-summary h2{font-size:22px;margin:3px 0 0}.today-summary .eyebrow{font-size:12px}.compact-add{background:var(--accent);color:white;border:0;border-radius:50%;width:40px;height:40px;font-size:27px}.today-compact{padding:16px!important;margin:0 0 11px!important;border-radius:22px!important}.today-compact .name{font-size:19px!important}.today-compact .eyebrow{font-size:12px!important}.today-compact .pill{font-size:12px;padding:5px 10px}.today-compact .week{margin:14px 0 12px!important;gap:4px}.today-compact .day{font-size:11px}.today-compact .day b{width:33px!important;height:33px!important;font-size:13px!important;margin-top:5px}.compact-actions{display:flex;gap:9px}.compact-actions .btn{flex:1;padding:10px!important;font-size:14px!important;border-radius:13px!important}.compact-detail{width:44px;border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:13px;font-size:22px}.app{padding-bottom:calc(105px + env(safe-area-inset-bottom))!important}
.stats-head{padding:14px 0}.stats-head h2{font-size:25px;line-height:1.2;margin:8px 0 12px}.stats-hero{background:linear-gradient(135deg,#7e65d3,#aa91ec);border-radius:25px;padding:22px;color:white;margin-bottom:13px}.stats-number{font-size:58px;font-weight:800;line-height:1}.stats-metrics{display:flex;gap:9px;flex-wrap:wrap;margin-top:19px}.stats-metrics span{background:#ffffff30;border-radius:30px;padding:8px 11px;font-size:13px}.stat-section{padding:18px!important;margin-bottom:13px!important}.stat-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:20px}.stat-day{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:var(--muted)}.stat-bar{height:80px;width:100%;max-width:30px;background:var(--raised);border-radius:9px;display:flex;align-items:end;overflow:hidden}.stat-bar i{display:block;background:var(--accent);width:100%;border-radius:9px}.mood-row{display:flex;justify-content:space-between;gap:4px;margin:15px 0 22px}.mood{border:1px solid var(--line);background:transparent;border-radius:13px;padding:8px 3px;flex:1;color:var(--text)}.mood span{display:block;font-size:25px}.mood small{font-size:9px}.mood.selected{background:var(--raised);border:2px solid var(--accent)}.energy-title{display:flex;justify-content:space-between;margin:10px 0}.stat-section input[type=range]{width:100%;accent-color:var(--accent);margin-bottom:18px}.stat-section textarea{display:block;width:100%;box-sizing:border-box;background:var(--raised);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px;font:inherit;margin:9px 0 13px;resize:vertical}.stats-title{margin:22px 0 12px}.stat-challenge{padding:15px!important;margin-bottom:10px!important}
</style>
</head>
<body><main class="app"><header class="top"><div class="brand">✦ LifeTrack <span style="color:var(--accent)">Mini</span></div></header><div id="screen"></div></main>
<nav class="nav" aria-label="Разделы"><button data-tab="today" aria-label="Сегодня"><span>⌂</span></button><button data-tab="progress" aria-label="Статистика"><span>⬡</span></button><button data-tab="library" aria-label="Челленджи"><span>ϟ</span></button></nav>
<script>
(()=>{
'use strict';
const KEY='lifetrack.v2',OLD='streaks.v1';
const root=document.getElementById('screen'),nav=document.querySelector('.nav');
let tab='today',detail=null,editing=null,template=null;
const date=(d=new Date())=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const shift=(iso,n)=>{const [y,m,d]=iso.split('-').map(Number);return date(new Date(y,m-1,d+n))};
const diff=(a,b)=>{const t=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((t(b)-t(a))/86400000)};
const today=()=>date(),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}};
function migrate(){
 const old=read(OLD);if(!old||!Array.isArray(old.habits))return [];
 return old.habits.map(h=>({id:h.id||uid(),name:String(h.name||'Привычка'),description:'',category:'Привычки',duration:30,repeat:'daily',start:shift(today(),-29),marks:h.marks&&typeof h.marks==='object'?h.marks:{},legacy:true}));
}
let data=read(KEY);
if(!data||!Array.isArray(data.challenges)){data={challenges:migrate()};try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Не удалось сохранить данные. Проверь свободное место и настройки Safari.')}}
function start(c){return c.start||today()}
function currentDay(c){return diff(start(c),today())+1}
function count(c){return Array.from({length:c.duration},(_,i)=>shift(start(c),i)).filter(d=>!!c.marks[d]).length}
function percent(c){return Math.round(count(c)/c.duration*100)}
function currentStreak(c){let n=0,i=c.marks[today()]?0:1;while(i<366&&c.marks[shift(today(),-i)]){n++;i++}return n}
function header(title,subtitle){return '<h1>'+escape(title)+'</h1><p class="sub">'+escape(subtitle)+'</p>'}
function progressBar(c){return '<div class="progress"><span style="width:'+percent(c)+'%"></span></div><div class="row small"><span>'+count(c)+' из '+c.duration+' дней</span><strong>'+percent(c)+'%</strong></div>'}
function todayCard(c){
 const done=!!c.marks[today()],idx=currentDay(c),active=idx>=1&&idx<=c.duration;
 const dow=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],offset=(new Date().getDay()+6)%7;
 let week='<div class="week">';
 for(let i=0;i<7;i++){const d=shift(today(),i-offset);week+='<div class="day">'+dow[i]+'<b class="'+(c.marks[d]?'done ':'')+(d===today()?'current':'')+'">'+(c.marks[d]?'✓':Number(d.slice(-2)))+'</b></div>'}
 week+='</div>';
 return '<article class="panel today-compact"><div class="row"><div class="grow"><div class="eyebrow">'+escape(c.category)+'</div><div class="name">'+escape(c.name)+'</div></div><span class="pill">'+(c.legacy?'Привычка':Math.min(Math.max(idx,0),c.duration)+'/'+c.duration)+'</span></div>'+
 week+'<div class="compact-actions"><button class="btn '+(done?'secondary':'')+'" data-done="'+escape(c.id)+'" '+(!active?'disabled':'')+'>'+(done?'✓ Выполнено':'✓ Отметить')+'</button><button class="compact-detail" data-detail="'+escape(c.id)+'" aria-label="Открыть календарь">▦</button></div></article>';
}
function renderToday(){
 const list=data.challenges.filter(c=>currentDay(c)>=1&&currentDay(c)<=c.duration);
 const completed=list.filter(c=>!!c.marks[today()]).length;
 root.innerHTML='<div class="today-summary"><div><div class="eyebrow">Мой день</div><h2>'+completed+' из '+list.length+' выполнено</h2></div><button class="compact-add" data-new aria-label="Создать цель">＋</button></div>'+
 (list.length?list.map(todayCard).join(''):'<div class="panel empty">Пока нет активных заданий. Нажми +, чтобы добавить первое.</div>');
}
const library=[
{name:'Чтение каждый день',category:'Саморазвитие',duration:30,level:'Легко',description:'Развивай привычку читать регулярно и с удовольствием.',benefit:'Улучшает концентрацию и расширяет кругозор.',instructions:'1. Выбери интересную книгу.\n2. Читай не менее 10 минут в день.\n3. Запиши одну мысль после чтения.',image:'https://images.unsplash.com/photo-1495446815901-a7297e633e8d?auto=format&fit=crop&w=1000&q=80'},
{name:'English Boost',category:'Английский',duration:30,level:'Средне',description:'Английский понемногу, но каждый день.',benefit:'Укрепляет словарный запас и понимание речи.',instructions:'1. Слушай английскую речь 5 минут.\n2. Выучи 3 полезные фразы.\n3. Произнеси их вслух и составь свои примеры.',image:'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&w=1000&q=80'},
{name:'30 дней силы',category:'Тренировки',duration:30,level:'Средне',description:'Небольшая ежедневная физическая активность с комфортной нагрузкой.',benefit:'Помогает закрепить привычку двигаться.',instructions:'1. Разомнись 3–5 минут.\n2. Выполни посильный комплекс упражнений.\n3. Отметь выполнение и самочувствие. При боли прекрати тренировку.',image:'https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1000&q=80'},
{name:'Цифровой детокс',category:'Здоровье',duration:21,level:'Легко',description:'Освободи время от бесцельного скроллинга.',benefit:'Помогает вернуть внимание важным делам.',instructions:'1. Выбери 30 минут без социальных сетей.\n2. Убери телефон подальше.\n3. Займись чтением, прогулкой или творчеством.',image:'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1000&q=80'},
{name:'Дневник дня',category:'Саморазвитие',duration:30,level:'Легко',description:'Каждый вечер осмысливай прожитый день.',benefit:'Развивает рефлексию и осознанность.',instructions:'1. Запиши три события дня.\n2. Отметь, что получилось хорошо.\n3. Выбери одно улучшение на завтра.',image:'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1000&q=80'},
{name:'Чистая речь',category:'Саморазвитие',duration:21,level:'Средне',description:'Тренируй связную речь без долгих пауз и слов-паразитов.',benefit:'Развивает уверенность при выступлениях.',instructions:'1. Выбери случайную тему.\n2. Говори о ней 30 секунд, записывая себя.\n3. Каждый день добавляй по 5 секунд.\n4. Пересмотри запись и оцени ясность речи.',image:'https://images.unsplash.com/photo-1475721027785-f74eccf877e2?auto=format&fit=crop&w=1000&q=80'},
{name:'Прогулка каждый день',category:'Здоровье',duration:30,level:'Легко',description:'Выделяй время для спокойной прогулки.',benefit:'Поддерживает регулярную активность.',instructions:'1. Выбери удобный маршрут.\n2. Прогуляйся 15–20 минут.\n3. Отметь выполнение.',image:'https://images.unsplash.com/photo-1476480862126-209bfaa8edc8?auto=format&fit=crop&w=1000&q=80'},
{name:'Творческий час',category:'Творчество',duration:14,level:'Средне',description:'Каждый день уделяй время своему проекту.',benefit:'Помогает продвигаться в любимом деле.',instructions:'1. Определи одну маленькую задачу.\n2. Работай 20 минут без отвлечений.\n3. Запиши, что получилось.',image:'https://images.unsplash.com/photo-1452860606245-08befc0ff44b?auto=format&fit=crop&w=1000&q=80'}
];
function renderLibrary(){
 const groups=[['Тело',['Тренировки','Здоровье']],['Разум',['Саморазвитие','Английский']],['Ремесло',['Творчество']]];
 const featured=library[5];
 root.innerHTML='<div class="catalog-top"><div><h1>Витрина</h1><p class="sub">Выбери новый вызов для себя</p></div></div>'+
 '<div class="hero-photo"><img loading="lazy" src="'+featured.image+'" alt=""><div class="hero-content"><div class="eyebrow" style="color:#e8dfff">ВЫБОР РЕДАКЦИИ</div><h1>'+escape(featured.name)+'</h1><p class="sub">'+featured.duration+' день · '+escape(featured.category)+'</p><button class="btn" style="margin-top:14px;background:#fff;color:#403251" data-template="5">Посмотреть программу →</button></div></div>'+
 groups.map(([group,cats])=>{const entries=library.map((c,i)=>({...c,i})).filter(c=>cats.includes(c.category));return '<div class="catalog-heading"><h2>'+group+'</h2><span class="small">'+entries.length+' программы</span></div><div class="catalog-scroll">'+entries.map(c=>'<button class="catalog-card" data-template="'+c.i+'"><img loading="lazy" src="'+c.image+'" alt=""><div class="hero-content"><div class="eyebrow">'+escape(c.level)+' · '+c.duration+' дней</div><strong>'+escape(c.name)+'</strong><small>'+escape(c.description)+'</small></div></button>').join('')+'</div>'}).join('')+
 '<button class="floating-create" data-new>＋ Придумать свой</button>';
}
function renderTemplate(){
 const c=library[template];if(!c){tab='library';return renderLibrary()}
 root.innerHTML='<button class="back" data-back>← Библиотека</button>'+
 '<div class="hero-photo"><img src="'+c.image+'" alt=""><div class="hero-content"><div class="eyebrow" style="color:#e8dfff">'+escape(c.category)+'</div><h1>'+escape(c.name)+'</h1><p class="sub">'+escape(c.description)+'</p></div></div>'+
 '<div class="info-tags"><span>◷ '+c.duration+' дней</span><span>✦ '+escape(c.level)+'</span><span>↻ Ежедневно</span></div>'+
 '<section class="detail-section"><h2>О челлендже</h2><p>'+escape(c.description)+' '+escape(c.benefit)+'</p></section>'+
 '<section class="detail-section"><h2>Как выполнять</h2><p class="steps">'+escape(c.instructions)+'</p></section>'+
 '<section class="detail-section"><h2>Твой результат</h2><p>'+escape(c.benefit)+' Начинай с комфортного темпа и отмечай каждый выполненный день.</p></section>'+
 '<div class="highlight-note" style="margin-top:14px">Перед стартом ты можешь изменить название, срок, дату начала и инструкции.</div>'+
 '<button class="btn full" style="margin-top:18px;padding:18px" data-use-template="'+template+'">Начать челлендж →</button>';
}
function renderChallenges(){
 root.innerHTML=header('Мои челленджи','Твои активные цели и ежедневный прогресс.')+
 (data.challenges.length?data.challenges.map(c=>'<article class="panel"><div class="row"><div class="grow"><div class="eyebrow">'+escape(c.category)+'</div><div class="name">'+escape(c.name)+'</div><p class="small">'+escape(start(c))+' · '+c.duration+' дней'+(c.legacy?' · перенесено из 1.1':'')+'</p></div><button class="btn secondary" data-detail="'+escape(c.id)+'">Открыть</button></div>'+progressBar(c)+'</article>').join(''):'<div class="panel empty">Пока нет челленджей</div>');
}
const JOURNAL_KEY='lifetrack.journal.v1';
let journal={};try{journal=JSON.parse(localStorage.getItem(JOURNAL_KEY)||'{}')||{}}catch{journal={}}
function renderProgress(){
 const all=data.challenges,total=all.reduce((n,c)=>n+count(c),0),finished=all.filter(c=>percent(c)===100).length;
 const entry=journal[today()]||{},days=Array.from({length:7},(_,i)=>shift(today(),i-6));
 const week=days.map(d=>{const n=all.filter(c=>!!c.marks[d]).length;return '<div class="stat-day"><span>'+['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][new Date(d+'T12:00:00').getDay()]+'</span><div class="stat-bar"><i style="height:'+Math.max(6,Math.round(n/Math.max(1,all.length)*100))+'%"></i></div><b>'+n+'</b></div>'}).join('');
 root.innerHTML='<div class="stats-head"><div class="eyebrow">Твоя орбита · '+new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+'</div><h2>Каждый день — шаг вперёд ✦</h2></div>'+
 '<div class="stats-hero"><div class="stats-number">'+total+'</div><div>выполненных действий за всё время</div><div class="stats-metrics"><span>🔥 '+Math.max(0,...all.map(currentStreak))+' дней серия</span><span>🏁 '+finished+' завершено</span></div></div>'+
 '<div class="panel stat-section"><div class="row"><b>Ритм недели</b><span class="small">Последние 7 дней</span></div><div class="stat-week">'+week+'</div></div>'+
 '<div class="panel stat-section"><div class="row"><b>Как прошёл день?</b><span class="pill">Сегодня</span></div><p class="small">Выбери настроение — это займёт секунду</p><div class="mood-row">'+[['😣','Тяжело'],['😕','Не очень'],['😐','Нормально'],['🙂','Хорошо'],['🤩','Отлично']].map(([emoji,label],i)=>'<button class="mood '+(entry.mood===i+1?'selected':'')+'" data-mood="'+(i+1)+'" aria-label="'+label+'"><span>'+emoji+'</span><small>'+label+'</small></button>').join('')+'</div><div class="energy-title">Энергия <strong>'+ (entry.energy||3)+'/5</strong></div><input id="energy" type="range" min="1" max="5" value="'+(entry.energy||3)+'"><label class="small" for="dailyNote">Маленькая победа дня</label><textarea id="dailyNote" rows="2" placeholder="Что сегодня получилось?">'+escape(entry.note||'')+'</textarea><button class="btn full" data-save-journal>Сохранить запись ✦</button><div class="small" id="journalStatus">'+(entry.saved?'✓ Запись сохранена':'')+'</div></div>'+
 '<h2 class="stats-title">Мои достижения</h2>'+(all.length?all.map(c=>'<div class="panel stat-challenge"><div class="row"><b>'+escape(c.name)+'</b><strong>'+percent(c)+'%</strong></div>'+progressBar(c)+'</div>').join(''):'<div class="panel empty">Начни первый челлендж, чтобы увидеть достижения.</div>')+
 '<div class="actions"><button class="btn secondary" data-export>Резервная копия</button><button class="btn ghost" data-import>Импорт</button></div><input id="importFile" class="hidden" type="file" accept="application/json,.json">';
}
function renderDetail(){
 const c=data.challenges.find(x=>x.id===detail);if(!c){detail=null;return render()}
 let grid='';
 for(let i=0;i<c.duration;i++){const d=shift(start(c),i),future=diff(today(),d)>0,done=!!c.marks[d],isToday=d===today();grid+='<button class="tile '+(done?'done ':'')+(future?'future ':'')+(isToday?'current':'')+'" data-mark="'+escape(c.id)+'" data-date="'+d+'" '+(future?'disabled':'')+' aria-label="День '+(i+1)+(done?', выполнено':'')+'">'+(done?'✓':i+1)+'</button>'}
 root.innerHTML='<button class="back" data-back>← Назад</button>'+header(c.name,c.description||c.category)+
 '<div class="panel"><div class="row"><span class="pill">'+escape(c.category)+'</span><span class="small">'+c.duration+' дней · '+(c.repeat==='daily'?'Ежедневно':'По выбору')+'</span></div>'+progressBar(c)+
 (c.instructions?'<h2>Как выполнять</h2><p class="sub" style="white-space:pre-line">'+escape(c.instructions)+'</p>':'')+'<h2>Календарь челленджа</h2><p class="sub">Нажми на прошедший день, чтобы отметить или снять выполнение.</p><div class="grid-days">'+grid+'</div>'+
 '<div class="actions"><button class="btn secondary" data-edit="'+escape(c.id)+'">Настроить</button><button class="btn ghost danger" data-delete="'+escape(c.id)+'">Удалить</button></div></div>';
}
function renderForm(){
 const c=editing?data.challenges.find(x=>x.id===editing):(template!==null?library[template]:null);
 const opt=(a,v)=>a.map(x=>'<option value="'+x+'" '+(String(v)===String(x)?'selected':'')+'>'+x+'</option>').join('');
 root.innerHTML='<button class="back" data-back>← Назад</button>'+header(c?'Настройки челленджа':'Новый челлендж','Выбери цель и двигайся к ней день за днём.')+
 '<form id="challengeForm" class="panel"><label class="field" for="fName">Название</label><input id="fName" maxlength="60" required placeholder="Например, читать 20 минут" value="'+escape(c?.name||'')+'">'+
 '<label class="field" for="fDescription">Описание (необязательно)</label><textarea id="fDescription" maxlength="200" placeholder="Зачем мне эта цель?">'+escape(c?.description||'')+'</textarea>'+
 '<label class="field" for="fCategory">Категория</label><select id="fCategory">'+opt(['Саморазвитие','Английский','Чтение','Тренировки','Здоровье','Творчество','Привычки','Другое'],c?.category||'Саморазвитие')+'</select>'+
 '<label class="field" for="fDuration">Продолжительность</label><select id="fDuration">'+opt([7,14,21,30,60,90],c?.duration||30)+'</select>'+
 '<label class="field" for="fRepeat">Повторение</label><select id="fRepeat"><option value="daily" '+(!c||c.repeat==='daily'?'selected':'')+'>Ежедневно</option><option value="flex" '+(c?.repeat==='flex'?'selected':'')+'>По выбору (отмечать нужные дни)</option></select>'+
 '<label class="field" for="fStart">Дата старта</label><input id="fStart" type="date" required value="'+escape(c?.start||today())+'">'+
 '<label class="field" for="fInstructions">Как выполнять (инструкция)</label><textarea id="fInstructions" style="min-height:145px" maxlength="2000" placeholder="Пошаговые действия на каждый день">'+escape(c?.instructions||'')+'</textarea><p class="note">Отметки привязаны к календарным датам. При изменении даты старта старые отметки сохранятся, но могут оказаться за пределами нового периода.</p>'+
 '<div class="form-actions"><button class="btn ghost" type="button" data-back>Отмена</button><button class="btn" type="submit">Сохранить</button></div></form>';
}
function render(){nav.classList.toggle('hidden',!!detail||['form','template'].includes(tab));nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='form')renderForm();else if(tab==='library')renderLibrary();else if(tab==='template')renderTemplate();else if(detail)renderDetail();else if(tab==='challenges')renderChallenges();else if(tab==='progress')renderProgress();else renderToday()}
function back(){if(tab==='form'){tab=template!==null?'template':editing?'challenges':'library';editing=null}else if(tab==='template'){tab='library'}else if(tab==='library'){tab='library';template=null}else{detail=null}render()}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;detail=null;editing=null;template=null;render();return}
 if(b.dataset.mood){journal[today()]={...(journal[today()]||{}),mood:Number(b.dataset.mood)};localStorage.setItem(JOURNAL_KEY,JSON.stringify(journal));render();return}
 if(b.hasAttribute('data-save-journal')){journal[today()]={...(journal[today()]||{}),energy:Number(document.getElementById('energy').value),note:document.getElementById('dailyNote').value,saved:true};localStorage.setItem(JOURNAL_KEY,JSON.stringify(journal));render();return}
 if(b.hasAttribute('data-back')){back();return}
 if(b.hasAttribute('data-new')){editing=null;template=null;detail=null;tab='form';render();return}
 if(b.hasAttribute('data-library')){tab='library';template=null;render();return}
 if(b.dataset.template!==undefined){template=Number(b.dataset.template);tab='template';render();return}
 if(b.dataset.useTemplate!==undefined){template=Number(b.dataset.useTemplate);editing=null;tab='form';render();return}
 if(b.dataset.detail){detail=b.dataset.detail;render();return}
 if(b.dataset.edit){editing=b.dataset.edit;template=null;detail=null;tab='form';render();return}
 if(b.dataset.done){const c=data.challenges.find(x=>x.id===b.dataset.done);if(!c)return;c.marks[today()]?delete c.marks[today()]:c.marks[today()]=true;save();render();return}
 if(b.dataset.mark){const c=data.challenges.find(x=>x.id===b.dataset.mark),d=b.dataset.date;if(!c||diff(today(),d)>0)return;c.marks[d]?delete c.marks[d]:c.marks[d]=true;save();render();return}
 if(b.dataset.delete){if(!confirm('Удалить челлендж и все его отметки?'))return;data.challenges=data.challenges.filter(x=>x.id!==b.dataset.delete);save();detail=null;render();return}
 if(b.hasAttribute('data-export')){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lifetrack-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}
 if(b.hasAttribute('data-import')){document.getElementById('importFile').click()}
});
let touchY=null,touchX=null;
document.addEventListener('touchstart',e=>{if(tab==='today'&&!detail&&window.scrollY<35){touchY=e.touches[0].clientY;touchX=e.touches[0].clientX}else{touchY=null}},{passive:true});
document.addEventListener('touchend',e=>{if(touchY===null)return;const dy=e.changedTouches[0].clientY-touchY,dx=e.changedTouches[0].clientX-touchX;touchY=null;if(dy>95&&Math.abs(dx)<70){tab='progress';render();window.scrollTo(0,0)}},{passive:true});
document.addEventListener('submit',e=>{if(e.target.id!=='challengeForm')return;e.preventDefault();
 const name=document.getElementById('fName').value.trim();if(name.length<2){alert('Название должно содержать минимум 2 символа');return}
 const values={name,description:document.getElementById('fDescription').value.trim(),category:document.getElementById('fCategory').value,duration:Number(document.getElementById('fDuration').value),repeat:document.getElementById('fRepeat').value,start:document.getElementById('fStart').value,instructions:document.getElementById('fInstructions').value.trim()};
 if(editing){const c=data.challenges.find(x=>x.id===editing);if(c)Object.assign(c,values)}else data.challenges.unshift({id:uid(),...values,marks:{}});
 save();editing=null;template=null;tab='challenges';detail=null;render();
});
document.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;try{const obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.challenges)||!obj.challenges.every(c=>c&&typeof c.name==='string'&&typeof c.marks==='object'&&c.marks!==null&&[7,14,21,30,60,90].includes(Number(c.duration))))throw Error('Неверный формат');
 if(!confirm('Заменить текущие данные импортированной копией? Сначала сохрани резервную копию.'))return;data=obj;save();render();alert('Данные восстановлены')}catch(err){alert('Не удалось импортировать файл: '+err.message)}});
render();
})();
</script></body></html>
