<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111018"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="VYRA"><meta name="description" content="VYRA — прокачивай героя в реальной жизни"><link rel="icon" type="image/svg+xml" href="vyra-icon.svg"><link rel="apple-touch-icon" sizes="180x180" href="vyra-app-icon.png"><link rel="manifest" href="vyra.webmanifest"><title>VYRA — Жизнь как игра</title>
<style>
:root{color-scheme:dark;--bg:#100f17;--panel:#201c29;--soft:#2c2636;--line:#3a3245;--text:#faf6f0;--muted:#a69dac;--gold:#ffac51;--mint:#62d9bd;--blue:#8cbafe;--pink:#ff86aa}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 85% 2%,#442d40 0%,transparent 42%),radial-gradient(ellipse at 0% 30%,#222137 0%,transparent 50%),var(--bg);min-height:100vh;color:var(--text);-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.app{max-width:530px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(110px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900;letter-spacing:1px}.mark{display:grid;place-items:center;width:39px;height:39px;background:linear-gradient(135deg,#ffca76,#ff6a64);border-radius:12px;color:#291723;font-size:24px;box-shadow:0 7px 25px #fa874943}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--gold);font-weight:800}.small{font-size:12px;color:var(--muted);line-height:1.5}.panel{border:1px solid #ffffff15;background:linear-gradient(145deg,#282231ed,#1b1923f0);border-radius:23px;padding:17px;margin:13px 0;box-shadow:0 15px 40px #0003}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:0;border-radius:15px;background:linear-gradient(100deg,#ffc06b,#f98256);color:#231824;font-weight:850;padding:12px 16px;box-shadow:0 6px 21px #f68c4c27}.btn.alt{background:#342d3d;color:var(--text);box-shadow:none;border:1px solid #ffffff15}.btn.tiny{font-size:12px;padding:8px 11px}.btn:disabled{opacity:.45}h1{font-size:28px;letter-spacing:-.6px;line-height:1.1;margin:7px 0}h2{font-size:19px;margin:25px 0 12px;letter-spacing:-.3px}.hero{position:relative;min-height:270px;overflow:hidden;padding:22px;background:radial-gradient(circle at 76% 26%,#b85c69a3,transparent 33%),linear-gradient(140deg,#322738,#201c2f 65%,#31243c);border:1px solid #885c5d77}.hero:after{content:"";position:absolute;right:-80px;bottom:-90px;width:260px;height:260px;border-radius:50%;border:1px solid #ffd18a55;box-shadow:0 0 0 28px #ffc16e0c,0 0 0 58px #ffc16e0b}.hero .figure{position:absolute;right:3px;bottom:-6px;font-size:147px;filter:drop-shadow(0 0 26px #ffb26b55);transform:rotate(-9deg)}.hero .copy{position:relative;z-index:1;max-width:66%}.xp{height:9px;background:#ffffff20;border-radius:20px;overflow:hidden;margin:12px 0 7px}.xp i,.track i{display:block;height:100%;background:linear-gradient(90deg,#f76d72,#ffbc67);border-radius:20px}.hero-title{font-size:34px;font-weight:900;margin:10px 0 3px}.rank{color:#ffcf9a;font-weight:750}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.stat{padding:15px 8px;text-align:center;background:#251f2f;border-radius:19px;border:1px solid #ffffff12}.stat .emoji{font-size:23px}.stat strong{display:block;font-size:23px;margin:5px 0 3px}.stat small{font-size:10px;color:var(--muted);line-height:1.3;display:block}.stat:nth-child(2) strong{color:var(--blue)}.stat:nth-child(3) strong{color:var(--mint)}.quest{padding:14px 0;border-bottom:1px solid #ffffff13}.quest:last-child{border:0;padding-bottom:3px}.quest strong{font-size:14px}.track{height:6px;border-radius:10px;background:#ffffff17;overflow:hidden;margin-top:9px}.tag{color:var(--gold);font-size:12px;font-weight:800}.nav{position:fixed;z-index:10;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 26px),500px);display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border:1px solid #ffffff26;border-radius:24px;background:#211c29ee;backdrop-filter:blur(20px);box-shadow:0 12px 40px #0009}.nav button{border:0;background:transparent;color:#a39aaa;border-radius:19px;padding:10px 1px;font-size:10px;font-weight:700}.nav button.active{background:#443042;color:#ffbd78}.nav span{display:block;font-size:22px;margin-bottom:5px}.tree{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px 7px;padding:9px 0}.talent{position:relative;border:1px solid #79636d;background:linear-gradient(140deg,#342b3b,#1e1a26);color:var(--text);border-radius:18px;min-height:112px;padding:10px 4px}.talent:before{content:"";position:absolute;top:50%;left:-8px;width:8px;height:2px;background:#a56b63}.talent:nth-child(3n+1):before{display:none}.talent.locked{opacity:.5;filter:grayscale(.8)}.talent.unlocked{border-color:#ffc87c;box-shadow:0 0 22px #fcb46f33}.talent .em{display:block;font-size:29px;margin-bottom:7px}.talent b{display:block;font-size:11px}.talent small{font-size:10px;color:var(--muted)}.reward{display:inline-block;background:#ffb76826;color:#ffc489;border:1px solid #ffb76855;border-radius:20px;padding:7px 11px;font-size:12px}.field{display:block;width:100%;margin-top:8px;border:1px solid var(--line);background:#1b1824;color:#fff;border-radius:13px;padding:13px;font-size:16px}.muted{color:var(--muted)}.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#3b3048;padding:12px 18px;border-radius:14px;z-index:30;box-shadow:0 10px 32px #0008;text-align:center;font-size:13px;width:max-content;max-width:90vw}.onboard{min-height:77vh;display:flex;flex-direction:column;justify-content:center;text-align:center}.onboard .orb{font-size:96px;margin:14px auto 8px;filter:drop-shadow(0 0 32px #ed977a)}.onboard h1{font-size:37px}.onboard p{color:var(--muted);line-height:1.6}.onboard .btn{width:100%;margin-top:18px}.onboard .features{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:21px 0}.feature{background:#2c2637;border:1px solid #ffffff15;padding:9px 12px;border-radius:40px;font-size:12px}.disclaimer{background:#292333;border:1px solid #574253;border-radius:16px;padding:12px;font-size:12px;line-height:1.55;color:#dfc8c5;margin-top:12px}.sectionhead{display:flex;align-items:center;justify-content:space-between}.pill{border:1px solid #ffffff24;border-radius:999px;padding:7px 10px;font-size:12px;color:var(--muted)}.empty{padding:20px;text-align:center;color:var(--muted)}@media(max-width:365px){.hero .figure{font-size:115px}.hero .copy{max-width:75%}.stat small{font-size:9px}}
</style></head>
<body><main class="app" id="app"></main><nav class="nav" id="nav" aria-label="Разделы"></nav><script>
(function(){
"use strict";
var KEY="vyra-rpg-v1",OLD="lifetrack-mini-v2",today=function(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
var initial={started:false,hero:"Странник",class:"Исследователь",steps:{},sleep:{},workouts:{},tasks:{},unlocks:[],manual:{},onboardHealth:false};
var state;try{state=Object.assign({},initial,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){state=Object.assign({},initial)}
var page="home",toastTimer;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(t){var e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);clearTimeout(toastTimer);toastTimer=setTimeout(function(){e.remove()},2500)}
function val(bucket){return Math.max(0,Number((state[bucket]||{})[today()])||0)}
function done(id){return !!((state.tasks[today()]||{})[id])}
function pct(n,g){return Math.max(0,Math.min(100,Math.round(n/g*100)))}
function milestones(){return Math.floor(Math.min(val("steps"),15000)/1000)}
function xp(){var s=Object.values(state.steps||{}).reduce(function(sum,n){return sum+Math.floor(Math.min(15000,Math.max(0,Number(n)||0))/1000)*12},0);var h=Object.values(state.sleep||{}).reduce(function(sum,n){return sum+Math.min(10,Math.max(0,Number(n)||0))*10},0);var w=Object.values(state.workouts||{}).reduce(function(sum,n){return sum+Math.min(3,Math.max(0,Number(n)||0))*40},0);return Math.floor(s+h+w+Object.values(state.tasks||{}).reduce(function(sum,v){return sum+Object.keys(v||{}).filter(function(k){return !!v[k]}).length*30},0))}
function level(){return Math.floor(xp()/200)+1}
function points(){return Math.max(0,Math.floor(xp()/200)-state.unlocks.length)}
var nodes=[
{id:"trail",name:"Следопыт",icon:"🧭",desc:"Первый шаг в новое приключение",need:1},
{id:"steady",name:"Стойкость",icon:"🛡️",desc:"Держи темп в повседневности",need:2,prev:"trail"},
{id:"rest",name:"Тихая гавань",icon:"🌙",desc:"Время для восстановления",need:3,prev:"steady"},
{id:"focus",name:"Фокус",icon:"🎯",desc:"Делай важное регулярно",need:3,prev:"trail"},
{id:"spark",name:"Искра",icon:"✨",desc:"Начни новое умение",need:4,prev:"focus"},
{id:"rush",name:"Рывок",icon:"⚡",desc:"Двигайся к следующей цели",need:5,prev:"steady"},
{id:"balance",name:"Баланс",icon:"⚖️",desc:"Сон, движение и привычки",need:6,prev:"rest"},
{id:"forge",name:"Мастерство",icon:"⚒️",desc:"Превращай практику в результат",need:7,prev:"spark"},
{id:"legend",name:"Легенда",icon:"👑",desc:"Вершина пути героя",need:10,prev:"balance"}
];
function progress(n,g){return '<div class="track"><i style="width:'+pct(n,g)+'%"></i></div>'}
function header(){return '<header class="top"><div class="brand"><span class="mark">ᛉ</span><span>VYRA</span></div><span class="pill">✦ '+level()+' ур.</span></header>'}
function onboarding(){return '<section class="onboard"><div class="eyebrow">Жизнь как игра · Новое приключение</div><div class="orb">ᛉ</div><h1>Твоя реальность.<br><span style="color:var(--gold)">Твоя легенда.</span></h1><p>Превращай движение, отдых и маленькие победы в опыт героя. Развивай таланты и исследуй собственный путь.</p><div class="features"><span class="feature">👟 Движение</span><span class="feature">🌙 Сон</span><span class="feature">⚔️ Квесты</span></div><div class="panel" style="text-align:left"><label class="small" for="heroName">Имя героя</label><input id="heroName" class="field" maxlength="22" value="'+esc(state.hero)+'"><label class="small" for="heroClass" style="display:block;margin-top:13px">Путь</label><select id="heroClass" class="field"><option>Исследователь</option><option>Хранитель</option><option>Созидатель</option></select></div><button class="btn" data-act="start">Начать путь →</button><div class="small" style="margin-top:14px">Работает на iPhone в браузере. Данные хранятся в этом браузере.</div></section>'}
function home(){var x=xp(),l=level(),step=val("steps"),sleep=val("sleep"),work=val("workouts");return header()+'<div class="eyebrow">Глава I · Пробуждение</div><section class="panel hero"><div class="figure">🧙🏻</div><div class="copy"><div class="rank">'+esc(state.class)+' · '+esc(state.hero)+'</div><div class="hero-title">Уровень '+l+'</div><div class="small" style="color:#f5d5c0">Искатель своего пути</div><div style="font-size:12px;margin-top:27px">✦ '+x%200+' / 200 XP</div><div class="xp"><i style="width:'+pct(x%200,200)+'%"></i></div><div class="small" style="color:#efddcd">До нового уровня '+(200-x%200)+' XP</div></div></section><div class="stats"><div class="stat"><div class="emoji">👟</div><strong>'+step.toLocaleString("ru-RU")+'</strong><small>Шаги сегодня</small></div><div class="stat"><div class="emoji">🌙</div><strong>'+sleep+' ч</strong><small>Сон</small></div><div class="stat"><div class="emoji">⚔️</div><strong>'+work+'</strong><small>Тренировки</small></div></div><h2>Ежедневные квесты</h2>'+questList(true)+'<section class="panel"><div class="sectionhead"><div><div class="eyebrow">Дерево талантов</div><h2 style="margin:5px 0">Открой свою силу</h2></div><span style="font-size:34px">🌳</span></div><p class="small">Очки талантов: '+points()+'. Новые способности открываются по мере получения XP.</p><button class="btn alt" style="width:100%;margin-top:13px" data-page="talents">Исследовать таланты →</button></section><div class="disclaimer">'+(window.VYRA_NATIVE?' Apple Здоровье подключается через системные разрешения iOS. Шаги, сон и тренировки синхронизируются автоматически.':' Apple Health: в этой веб-версии нет прямого доступа к HealthKit. Шаги можно передать через «Команды» или внести вручную. Сон и тренировки пока вводятся вручную.')+'</div>'}
function questList(short){var s=val("steps"),h=val("sleep"),w=val("workouts");var tasks=[{id:"walk",em:"👟",title:"Пройди 7 000 шагов",n:s,g:7000,unit:""},{id:"sleep",em:"🌙",title:"Восстановись за 8 часов сна",n:h,g:8,unit:" ч"},{id:"train",em:"⚔️",title:"Выполни тренировку",n:w,g:1,unit:""},{id:"focus",em:"🎯",title:"15 минут на важное дело",n:done("focus")?1:0,g:1,unit:"",manual:true}];return '<div class="panel" style="margin-top:0">'+tasks.map(function(t){var ok=t.manual?done(t.id):t.n>=t.g;return '<div class="quest"><div class="row"><span style="font-size:23px">'+t.em+'</span><div style="flex:1"><strong>'+t.title+'</strong><div class="small">'+(t.manual?'Отметь выполнение вручную':Math.min(t.n,t.g).toLocaleString("ru-RU")+' / '+t.g.toLocaleString("ru-RU")+t.unit)+'</div>'+progress(t.n,t.g)+'</div>'+(t.manual?'<button class="btn tiny '+(ok?'alt':'')+'" data-act="focus">'+(ok?'✓ Готово':'+30 XP')+'</button>':'<span style="font-size:18px;color:'+(ok?'var(--mint)':'var(--muted)')+'">'+(ok?'✓':'○')+'</span>')+'</div></div>'}).slice(0,short?3:4).join("")+'</div>'}
function quests(){return header()+'<div class="eyebrow">Твой ежедневный маршрут</div><h1>Квесты</h1><p class="small">Каждый шаг помогает путешествию. Цели не являются медицинскими рекомендациями — измени их под себя в следующих обновлениях.</p><h2>Задания на сегодня</h2>'+questList(false)+'<h2>Записать активность</h2><section class="panel"><label class="small">Шаги сегодня</label><input id="steps" class="field" type="number" min="0" max="100000" value="'+val("steps")+'"><label class="small" style="display:block;margin-top:13px">Сон прошлой ночью, часы</label><input id="sleep" class="field" type="number" min="0" max="24" step=".5" value="'+val("sleep")+'"><label class="small" style="display:block;margin-top:13px">Тренировки сегодня</label><input id="workouts" class="field" type="number" min="0" max="10" value="'+val("workouts")+'"><button class="btn" style="width:100%;margin-top:14px" data-act="saveHealth">Сохранить показатели</button><p class="small" style="margin-top:10px">'+(window.VYRA_NATIVE?' Показатели обновляются из Apple Здоровья автоматически. Ручной ввод оставлен на случай отсутствия данных.':'Не подключено к Apple Health напрямую. Шаги можно автоматически передавать из iOS «Команд» через ссылку вида #healthsteps=ГГГГ-ММ-ДД:1234.')+'</p></section>'}
function talents(){return header()+'<div class="eyebrow">Путь персонажа</div><h1>Дерево талантов</h1><p class="small">Получай XP за активность и привычки, затем открывай новые способности. Пока они дают коллекционный прогресс без игровых усилений.</p><div class="panel row"><div><div style="font-size:23px;font-weight:900">'+points()+' ✦</div><div class="small">Доступно очков талантов</div></div><div class="reward">Уровень '+level()+'</div></div><div class="tree">'+nodes.map(function(t){var unlocked=state.unlocks.includes(t.id),available=level()>=t.need&&(!t.prev||state.unlocks.includes(t.prev))&&points()>0;return '<button class="talent '+(unlocked?'unlocked':available?'':'locked')+'" data-talent="'+t.id+'"><span class="em">'+t.icon+'</span><b>'+t.name+'</b><small>'+(unlocked?'✓ Открыто':'Ур. '+t.need)+'</small></button>'}).join("")+'</div><div class="panel"><h2 style="margin:0 0 8px">Как это работает</h2><p class="small">За каждые 200 XP повышается уровень и появляется очко таланта. Последующие узлы требуют предыдущих открытий. Выбирай собственную ветку развития.</p></div>'}
function profile(){return header()+'<div class="eyebrow">Профиль путешественника</div><h1>'+esc(state.hero)+'</h1><p class="small">'+esc(state.class)+' · уровень '+level()+'</p><div class="panel"><div class="row"><span>✨ Всего опыта</span><b>'+xp()+' XP</b></div><hr style="border:0;border-top:1px solid #ffffff17;margin:16px 0"><div class="row"><span>🌿 Открытые таланты</span><b>'+state.unlocks.length+' / '+nodes.length+'</b></div><hr style="border:0;border-top:1px solid #ffffff17;margin:16px 0"><div class="row"><span>🏃 Шаги сегодня</span><b>'+val("steps")+'</b></div><hr style="border:0;border-top:1px solid #ffffff17;margin:16px 0"><div class="row"><span>🧭 Дистанция</span><b>'+((state.distanceMeters||{})[today()]?((state.distanceMeters[today()]/1000).toFixed(2)+" км"):"—")+'</b></div></div><h2>Apple Здоровье</h2><div class="panel"><div class="row"><span>🔒 HealthKit</span><span class="reward">Веб-версия</span></div><p class="small" style="margin-top:12px">'+(window.VYRA_NATIVE?'VYRA получает показатели через HealthKit по разрешениям iOS. Apple не сообщает, какие разрешения на чтение были отклонены.':'Настоящее системное окно доступа Apple Health возможно в нативном приложении для iOS. Здесь поддерживаются ручной ввод и импорт шагов через «Команды».')+'</p>'+(window.VYRA_NATIVE?'<button class="btn alt" style="width:100%;margin-top:12px" data-act="healthSync">↻ Обновить показатели</button><button class="btn alt" style="width:100%;margin-top:9px" data-act="healthConnect">Разрешения Apple Здоровья</button>':'<button class="btn alt" style="width:100%;margin-top:12px" data-act="healthHelp">Как импортировать шаги</button>')+'</div><h2>Мои данные</h2><section class="panel"><button class="btn alt" data-act="export" style="width:100%">⬇ Экспорт сохранения JSON</button><button class="btn alt" data-act="reset" style="margin-top:10px;width:100%">Начать заново</button><p class="small" style="margin-top:12px">Прогресс хранится локально в браузере. Старые данные LifeTrack Mini не удаляются и доступны в исходной версии.</p></section>'}
function nav(){document.getElementById("nav").style.display=state.started?"grid":"none";document.getElementById("nav").innerHTML=[["home","⌂","Герой"],["quests","⚔","Квесты"],["talents","✣","Таланты"],["profile","♙","Профиль"]].map(function(i){return '<button data-page="'+i[0]+'" class="'+(page===i[0]?'active':'')+'"><span>'+i[1]+'</span>'+i[2]+'</button>'}).join("")}
function render(){document.getElementById("app").innerHTML=!state.started?onboarding():page==="home"?home():page==="quests"?quests():page==="talents"?talents():profile();nav()}
function importSteps(){var m=location.hash.match(/healthsteps=(\d{4}-\d{2}-\d{2}):(\d{1,8})/);if(!m)return false;var n=Number(m[2]);if(n>100000||!Number.isFinite(n))return false;var date=m[1];if((state.steps[date]||0)!==n){state.steps[date]=n;save();history.replaceState(null,"",location.pathname+location.search);toast("Шаги из «Команд» импортированы: "+n);return true}history.replaceState(null,"",location.pathname+location.search);return false}
function cap(id,min,max){var el=document.getElementById(id),n=Number(el&&el.value);if(!Number.isFinite(n))return 0;return Math.max(min,Math.min(max,n))}
document.addEventListener("click",function(e){var b=e.target.closest("[data-act],[data-page],[data-talent]");if(!b)return;if(b.dataset.page){page=b.dataset.page;render();window.scrollTo(0,0);return}if(b.dataset.talent){var t=nodes.find(function(n){return n.id===b.dataset.talent});if(state.unlocks.includes(t.id)){toast(t.name+": "+t.desc);return}if(level()<t.need){toast("Нужен уровень "+t.need);return}if(t.prev&&!state.unlocks.includes(t.prev)){toast("Сначала открой предыдущий талант");return}if(points()<1){toast("Получай XP, чтобы заработать очко таланта");return}state.unlocks.push(t.id);save();render();toast("Открыт талант: "+t.name);return}switch(b.dataset.act){case "start":state.hero=(document.getElementById("heroName").value||"Странник").trim().slice(0,22)||"Странник";state.class=document.getElementById("heroClass").value;state.started=true;save();render();break;case "saveHealth":state.steps[today()]=cap("steps",0,100000);state.sleep[today()]=cap("sleep",0,24);state.workouts[today()]=cap("workouts",0,10);save();render();toast("Активность записана");break;case "focus":if(!state.tasks[today()])state.tasks[today()]={};state.tasks[today()].focus=!state.tasks[today()].focus;save();render();break;case "healthSync":if(window.VYRA_NATIVE){window.webkit.messageHandlers.vyra.postMessage({action:"refreshHealth"});toast("Запросили обновление Apple Здоровья")}break;case "healthConnect":if(window.VYRA_NATIVE){window.webkit.messageHandlers.vyra.postMessage({action:"requestHealth"});}break;case "healthHelp":alert("На iPhone открой приложение «Команды». Создай команду: Найти образцы здоровья → тип Шаги, за сегодня → суммировать количество → Текст со ссылкой на приложение и фрагментом #healthsteps=ГГГГ-ММ-ДД:ЧИСЛО → Открыть URL. Это альтернативный импорт для веб-приложения; прямого HealthKit-доступа у браузера нет.");break;case "export":var a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.href=u;a.download="vyra-save-"+today()+".json";a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000);break;case "reset":if(confirm("Удалить только прогресс VYRA на этом устройстве? Исходный LifeTrack останется без изменений.")){localStorage.removeItem(KEY);state=Object.assign({},initial);page="home";render()}break;}})
window.addEventListener("hashchange",function(){if(importSteps())render()});document.addEventListener("visibilitychange",function(){if(!document.hidden&&importSteps())render()});
window.addEventListener("vyra-health",function(event){
  const payload=event.detail||{};
  for(const key of ["steps","sleep","workouts","distanceMeters"]){
    if(!payload[key]||typeof payload[key]!=="object")continue;
    if(!state[key]||typeof state[key]!=="object")state[key]={};
    for(const [day,raw] of Object.entries(payload[key])){
      const value=Number(raw);
      if(/^\d{4}-\d{2}-\d{2}$/.test(day)&&Number.isFinite(value)&&value>=0){
        // Never overwrite manually entered values with empty (or denied) HealthKit queries.
        state[key][day]=key==="sleep"?Math.round(value*100)/100:Math.round(value);
      }
    }
  }
  state.nativeHealthLastSync=payload.updatedAt||new Date().toISOString();
  save();render();
});
importSteps();render();
})();
</script></body></html>
