name: VYRA
options:
  bundleIdPrefix: app.vyra
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  VYRA:
    type: application
    platform: iOS
    sources:
      - path: VYRA
        excludes:
          - Resources
          - Assets.xcassets
      - path: VYRA/Resources
        type: folder
      - path: VYRA/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vyra.mobile
        INFOPLIST_FILE: VYRA/Info.plist
        CODE_SIGN_ENTITLEMENTS: VYRA/VYRA.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Generate VYRA iOS App Icon
        script: |
          sips -z 1024 1024 "$SRCROOT/VYRA/Resources/vyra-app-icon.png" --out "$SRCROOT/VYRA/Assets.xcassets/AppIcon.appiconset/AppIcon.png" >/dev/null
        outputFiles:
          - "$(SRCROOT)/VYRA/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
